# Sets default memory used for Gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx5G
org.gradle.daemon=false

# In the case that Gradle needs to fork to recompile, this will set the memory for that process.
systemProp.net.minecraftforge.gradle.repo.recompile.fork=true
systemProp.net.minecraftforge.gradle.repo.recompile.fork.args=-Xmx5G

# Opts-out of ForgeGradle automatically adding mavenCentral(), Forge's maven and MC libs maven to the repositories block
systemProp.net.minecraftforge.gradle.repo.attach=false


## Minecraft-Version

# Standard-Version fuer Builds. Alle versionsabhaengigen Werte (Forge, Mappings, Java ...)
# stehen in versions/<Version>.properties, versionsabhaengiger Code in src/mc/<Version>/.
# Andere Version bauen: gradlew build -Pmc_version=1.21.8  oder  Lumen_Bauen_und_Installieren.bat -Mc 1.21.8
mc_version=1.21.7
# Mapping-Kanal fuer alle Versionen: offizielle Mojang-Namen.
mapping_channel=official


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=examplemod
# The human-readable display name for the mod.
mod_name=Lumen Client
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# Versionsschema: <minecraft_version>_v<mod_build>, z.B. 1.21.7_v1. Je hoeher mod_build, desto neuer.
# Lumen_Bauen_und_Installieren.bat baut mit dieser Nummer und erhoeht sie nach jedem erfolgreichen Build.
# Die Nummer gilt fuer alle Minecraft-Versionen gemeinsam (gleicher Funktionsstand = gleiche Nummer).
mod_build=30
# Dateiname der fertigen JAR: <mod_file_name>-<minecraft_version>_v<mod_build>.jar
mod_file_name=LumenClient
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.example.examplemod
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Lumen Client
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Lumen Client - moderner Minecraft-Client mit X-Ray, ESP, Freecam, Zoom, Wegpunkten mit Teleport, Kompass und frei anpassbarem HUD.